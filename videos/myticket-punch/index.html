      // ===== S1 hook (0–2.5) =====
      tl.fromTo("#s1-glow", { scale: 0.85, opacity: 0.6 }, { scale: 1.1, opacity: 1, duration: 2.5, ease: "sine.inOut" }, 0);
      tl.fromTo("#s1-ghost", { y: 0 }, { y: -120, duration: 2.5, ease: "none" }, 0);
      tl.fromTo(".rail", { xPercent: 0 }, { xPercent: 8, duration: 2.5, ease: "none" }, 0);
      const hits = [0, 0.5, 1.0, 1.5];
      ["#w1", "#w2", "#w3", "#w4"].forEach((id, i) => {
        const t = hits[i];
        tl.fromTo(id, { opacity: 0, scale: 1.55, rotation: i % 2 ? 3 : -3, filter: "blur(14px)" },
          { opacity: 1, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, t);
        tl.to(id, { opacity: 0, duration: 0.06, ease: "none" }, (hits[i + 1] ?? 2.0) - 0.06);
        tl.fromTo("#s1-flash", { opacity: 0.55 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: i === 0 }, t);
      });
      tl.fromTo("#s1-lead", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.0);
      tl.fromTo("#s1-lead span", { scale: 1 }, { scale: 0.7, duration: 0.25, ease: "power2.in" }, 2.25);

      // ===== S2 ticket (2.5–5.5) =====
      tl.fromTo("#s2-ghost", { x: -200 }, { x: 200, duration: 3, ease: "none" }, 2.5);
      tl.fromTo("#ticket", { y: -1500, rotation: -16 }, { y: 0, rotation: -4, duration: 0.42, ease: "expo.out" }, 2.5);
      tl.fromTo("#ticket", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 2.75);
      tl.fromTo("#t-title .big", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.85);
      tl.fromTo("#t-title .sub", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.05);
      tl.fromTo(".t-row", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.0);
      tl.fromTo("#barcode i", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out", stagger: 0.008 }, 3.15);
      tl.fromTo("#t-perf", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 3.65);
      // tear
      tl.fromTo("#t-stub", { y: 0, x: 0, rotation: 0 }, { y: 30, x: -14, rotation: -5, duration: 0.12, ease: "power2.out" }, 4.2);
      tl.to("#t-stub", { y: 1250, x: -160, rotation: -32, duration: 0.7, ease: "power2.in" }, 4.32);
      tl.fromTo("#t-perf", { opacity: 1 }, { opacity: 0, duration: 0.1 }, 4.25);
      tl.fromTo("#t-main", { rotation: 0 }, { rotation: 6, duration: 0.5, ease: "back.out(2.5)" }, 4.25);
      tl.to("#ticket", { y: -1700, scale: 0.7, rotation: 4, duration: 0.42, ease: "power3.in" }, 5.05);

      // ===== S3 seats -> QR -> punch (5.5–10.0) =====
      tl.fromTo("#s3-glow", { scale: 0.9 }, { scale: 1.15, duration: 4.5, ease: "sine.inOut" }, 5.5);
      tl.fromTo("#s3-t1", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.5);
      tl.fromTo(["#stage", "#stage-lbl"], { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 5.55);
      seatEls.forEach((s) => tl.fromTo(s, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 5.6 + parseFloat(s.dataset.d) * 0.12));
      tl.fromTo("#dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 6.85);
      tl.fromTo("#dot", { boxShadow: "0 0 0 0 rgba(252,90,26,0.0)" }, { boxShadow: "0 0 60px 10px rgba(252,90,26,0.55)", duration: 0.3 }, 7.0);
      tl.fromTo("#ring", { opacity: 0, scale: 0.6 }, { opacity: 1, duration: 0.01 }, 7.0);
      tl.to("#ring", { opacity: 0, scale: 1.8, duration: 0.5, ease: "power2.out" }, 7.01);
      tl.fromTo("#s3-cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 7.0);
      // seats collapse, title swap, dot rises to QR center
      tl.to(seatEls, { scale: 0, duration: 0.25, ease: "power2.in", stagger: { each: 0.004, from: "center" } }, 7.35);
      tl.to(["#stage", "#stage-lbl", "#s3-cap"], { opacity: 0, duration: 0.2 }, 7.35);
      tl.to("#s3-t1", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, 7.4);
      tl.fromTo("#s3-t2", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.55);
      tl.to("#dot", { y: -114, scale: 1.45, duration: 0.45, ease: "power3.inOut" }, 7.45);
      tl.fromTo("#qr", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 7.5);
      qrEls.forEach((m) => tl.fromTo(m, { scale: 0 }, { scale: 1, duration: 0.18, ease: "back.out(2)" }, 7.6 + parseFloat(m.dataset.d) * 0.06));
      // tension then punch
      tl.fromTo("#qr", { rotation: 0 }, { rotation: -2, duration: 0.9, ease: "sine.in" }, 8.5);
      tl.to("#dot", { scale: 1.2, duration: 0.25, ease: "power2.in" }, 9.15);
      tl.to("#dot", { scale: 30, duration: 0.4, ease: "expo.in" }, 9.4);

      // ===== S4 logo (9.8–15) =====
      tl.fromTo("#s4-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.1, opacity: 1, duration: 5.2, ease: "sine.inOut" }, 9.8);
      tl.fromTo("#s4-ghost", { x: 150 }, { x: -150, duration: 5.2, ease: "none" }, 9.8);
      tl.fromTo("#lockup", { scale: 1 }, { scale: 1.04, duration: 5.2, ease: "none" }, 9.8);
      ["#b1 svg", "#b2 svg", "#b3 svg"].forEach((s, i) =>
        tl.fromTo(s, { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 10.0 + i * 0.12));
      // punch: chip pops out of the notch
      tl.fromTo("#mfull", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 10.85);
      tl.fromTo(["#b1", "#b2", "#b3"], { opacity: 1 }, { opacity: 0, duration: 0.01 }, 10.86);
      tl.set("#mfull .chipfill", { opacity: 0 }, 11.0);
      tl.fromTo("#chip", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 11.0);
      tl.fromTo("#chip", { scale: 1 }, { scale: 1.25, duration: 0.08, ease: "power2.out", immediateRender: false }, 11.0);
      tl.to("#chip", { x: -900, y: -700, rotation: -40, scale: 0.6, duration: 0.6, ease: "power2.in" }, 11.08);
      tl.fromTo("#mark", { rotation: 0 }, { rotation: -3, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, 11.0);
      tl.fromTo("#word", { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, 11.4);
      tl.fromTo("#tagline", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 12.0);
      tl.fromTo("#cta", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 12.6);

      // grain jitter (stepped, deterministic)
      tl.fromTo(".grain", { x: 0, y: 0 }, { x: 60, y: -40, duration: 15, ease: "steps(90)" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
